[package]
name = "game-native"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
game-core = { path = "../game-core" }
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
webrtc = "0.11"
serde_json = "1"
serde = "1"
base64 = "0.22"
tokio-tungstenite = "*"
futures-util = "0.3"
futures-channel = "0.3"
derive_builder = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.sdl2]
version = "0.36"
default-features = false
features = ["image", "ttf"]