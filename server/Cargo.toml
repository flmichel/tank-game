[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8"}
tower-http = { version = "0.7", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["full"] }
sqlx = { version = "0.9.0", features = [ "runtime-tokio", "macros", "postgres"] }
rand = { version = "0.10" }
argon2 = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
futures-channel = "0.3"
base64-url = "3"
config = "0.15"

